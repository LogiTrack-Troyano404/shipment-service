services:
  # Servicio de la Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: shipment-mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: shipment-service
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shipment-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  # Servicio del Microservicio Spring Boot
  shipment-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shipment-service-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/shipment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shipment-network

volumes:
  mysql_data:

networks:
  shipment-network:
    driver: bridge